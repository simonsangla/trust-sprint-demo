# Local gate. Install once: `uvx pre-commit install`. Run everything: `uvx pre-commit run --all-files`.
# Generated site/ is excluded from every hook (rebuilt by dbt docs / scripts/build_app.py, never hand-edited).
exclude: ^(site/|app/|target/|dbt_packages/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # scripts/og-card.html is the committed source of the OG image and has no final newline; left as is
        exclude: ^scripts/og-card\.html$
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
        additional_dependencies: [dbt-duckdb, sqlfluff-templater-dbt]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: dbt-parse
        name: dbt parse (DuckDB)
        entry: env DBT_PROFILES_DIR=. uvx --with dbt-duckdb --from dbt-core dbt parse
        language: system
        pass_filenames: false
        files: ^(models/|macros/|seeds/|tests/|dbt_project\.yml|profiles\.yml)
