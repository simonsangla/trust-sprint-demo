# Local gate. Install once: `uvx pre-commit install`. Run everything: `uvx pre-commit run --all-files`.
# Generated site/ is excluded from every hook (rebuilt by dbt docs / scripts/build_app.py, never hand-edited).
exclude: ^(site/|app/|target/|dbt_packages/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # scripts/og-card.html is the committed source of the OG image and has no final newline; left as is
        exclude: ^scripts/og-card\.html$
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
        additional_dependencies: [dbt-duckdb, sqlfluff-templater-dbt]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: dbt-parse
        name: dbt parse (DuckDB)
        entry: env DBT_PROFILES_DIR=. uvx --with dbt-duckdb --from dbt-core dbt parse
        language: system
        pass_filenames: false
        files: ^(models/|macros/|seeds/|tests/|dbt_project\.yml|profiles\.yml)
      - id: actions-pinned-by-sha
        name: workflow actions pinned by commit SHA
        entry: bash scripts/check_actions_pinned.sh
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
  # dbt-checkpoint: metadata checks over target/manifest.json, written by the dbt-parse hook above
  # (hooks run in file order, so this block must stay after it). Manifest-only hooks: none needs
  # catalog.json or a warehouse. Never add unify-column-description (it rewrites descriptions).
  # check-model-columns-have-desc is left out: 22 columns are undocumented on main (mission-os#1531).
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.10
    hooks:
      - id: check-model-has-properties-file
        files: ^models/
      - id: check-model-has-description
        files: ^models/
      - id: check-model-has-tests
        args: [--test-cnt, "1", --]
        files: ^models/
      # every model keeps a uniqueness test on its grain (a singular test does not count here)
      - id: check-model-has-tests-by-name
        args: [--tests, unique=1, --]
        files: ^models/
      - id: check-script-has-no-table-name
        files: ^models/
