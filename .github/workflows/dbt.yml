name: dbt build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: dbt build (DuckDB, offline, reads the frozen Cortex answers, never Snowflake)
        env: {DBT_PROFILES_DIR: .}
        run: uvx --with dbt-duckdb --from dbt-core dbt build
      - name: proofs (claims re-tested against this demo)
        env: {DBT: uvx --with dbt-duckdb --from dbt-core dbt}
        run: bash proofs/run_all.sh
      - name: docs site carries every proof and request id (regenerate, then check committed site/)
        env: {DBT_PROFILES_DIR: .}
        run: |
          uvx --with dbt-duckdb --from dbt-core dbt docs generate --static
          python3 scripts/sanitize_docs.py
          python3 scripts/check_site_proofs.py site/index.html
          python3 scripts/check_site_proofs.py
