name: dbt build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # One script is the definition of green: the same one a contributor runs before a PR.
      - name: pre-PR checks (lint, dbt build, proofs, docs site)
        run: bash scripts/pre-pr.sh
