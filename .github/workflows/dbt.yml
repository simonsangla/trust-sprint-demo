name: dbt build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: dbt build (DuckDB, offline, reads the frozen Cortex answers, never Snowflake)
        env: {DBT_PROFILES_DIR: .}
        run: uvx --with dbt-duckdb --from dbt-core dbt build
