version: 2
seeds:
  - name: users
    config: {column_types: {user_id: varchar, signup_date: date, country: varchar, plan: varchar}}
  - name: sessions
    config: {column_types: {session_id: varchar, user_id: varchar, session_date: date, channel: varchar}}
  - name: bookings
    config: {column_types: {booking_id: varchar, user_id: varchar, session_id: varchar, booking_date: date, amount: "decimal(12,2)", status: varchar}}
  - name: question_pack
    description: >
      The ground-truth question set: the question, a structured spec (metric_key and window), the expected
      answer, its owner, and an independent re-derivation. Shape follows bricks/snowflake-cortex-agent-eval.
    config:
      column_types: {question_id: varchar, question: varchar, metric_key: varchar, date_from: date, date_to: date,
                     channel: varchar, expected_answer: varchar, tolerance: double, owner: varchar,
                     rederived_by: varchar, as_of: date, set_name: varchar, expect_refusal: boolean}
  - name: metric_registry
    description: What the Snowflake semantic view does and does not define, one row per metric_key.
    config: {column_types: {metric_key: varchar, status: varchar, has_zero_guard: varchar, note: varchar}}
  - name: cortex_answers
    description: >
      FROZEN output of one live Cortex Analyst run (scripts/run_cortex.py). Never regenerated by dbt.
      One row per question with the SQL the analyst generated, the value that SQL returned, and the request id.
    config:
      column_types: {question_id: varchar, question: varchar, generated_sql: varchar, answer_value: varchar,
                     request_id: varchar, run_ts: varchar, analyst_text: varchar, execution_error: varchar, row_count: integer}
